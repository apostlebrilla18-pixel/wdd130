<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapids</title>
    <meta name="description"
      content="Get in touch with Rapids Company. Find our address, phone, email, and send us a message about reservations or general inquiries.">
    <meta name="author" content="Randy Manasseh Akrofi">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-rapids-trees.jpg" alt="Rapids">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>

        <section class="contact-info">
            <div>
                <h2>Get in Touch</h2>
                <address>
                    <p>123 Rapids Way, Accra, Ghana</p>
                    <p>Phone: +233 20 130 2848</p>
                    <p>Email: info@rapidscompany.com</p>
                </address>
            </div>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d63372.8!2d-0.187!3d5.6037!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sAccra%2C+Ghana!5e0!3m2!1sen!2sgh!4v1234567890"
                  width="400" height="250" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Rapids Company location map"></iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="card-grid">
                <figure>
                    <img src="images/jane-mensah.jpg" alt="Jane Mensah">
                    <figcaption>Jane Mensah — Lead Rafting Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/kwame-boateng.jpg" alt="Kwame Boateng">
                    <figcaption>Kwame Boateng — Safety Officer</figcaption>
                </figure>
                <figure>
                    <img src="images/akosua-owusu.jpg" alt="Akosua Owusu">
                    <figcaption>Akosua Owusu — Customer Relations Manager</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of your message:</legend>
                    <label><input type="radio" name="purpose" value="general" checked> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Rapids Company &raquo; Randy Manasseh Akrofi</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://x.com">
                <img src="images/x-bw.svg" alt="X Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
